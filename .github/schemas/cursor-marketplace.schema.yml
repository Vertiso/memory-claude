# Validation-equivalent projection of Cursor's official JSON Schema.
source:
  repository: "https://github.com/cursor/plugins"
  commit: "a29f5a8ca161b1de4ffc5484454958bebc04eaa5"
  path: "schemas/marketplace.schema.json"
  checked_on: "2026-07-12"

$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://cursor.com/schemas/cursor-plugin/marketplace.json"
type: "object"
required:
  - "name"
  - "plugins"
additionalProperties: false
properties:
  name:
    type: "string"
    minLength: 1
  owner:
    $ref: "#/$defs/owner"
  metadata:
    type: "object"
    additionalProperties: true
    properties:
      description:
        type: "string"
  plugins:
    type: "array"
    items:
      $ref: "#/$defs/pluginEntry"
$defs:
  owner:
    type: "object"
    required:
      - "name"
    additionalProperties: false
    properties:
      name:
        type: "string"
        minLength: 1
      email:
        type: "string"
        format: "email"
  pluginEntry:
    type: "object"
    required:
      - "name"
      - "source"
    additionalProperties: false
    properties:
      name:
        type: "string"
        minLength: 1
        pattern: "^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$"
      source:
        type: "string"
        minLength: 1
      description:
        type: "string"
